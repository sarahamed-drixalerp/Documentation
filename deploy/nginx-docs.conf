# /etc/nginx/sites-available/docs.drixalerp.com
# Enable:  ln -s /etc/nginx/sites-available/docs.drixalerp.com /etc/nginx/sites-enabled/
# HTTPS:   certbot --nginx -d docs.drixalerp.com
server {
    listen 80;
    server_name docs.dev.drixalerp.com;

    root /var/www/Aspire-Docs/current;
    index index.html;

    # Docusaurus static output (Arabic at /, English at /en/)
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    location = /en {
        return 301 /en/;
    }
    location /en/ {
        try_files $uri $uri/ $uri.html /en/404.html;
    }

    # Deployment record must never be cached (CI health check reads it)
    location = /deployment.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed assets can be cached long-term
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
